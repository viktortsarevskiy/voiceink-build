name: build-voiceink

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Clone VoiceInk
        run: git clone --depth 1 https://github.com/Beingpax/VoiceInk.git

      - name: Select newest Xcode
        run: |
          ls /Applications/ | grep -i xcode
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version && swift --version

      - name: Build (local, ad-hoc signed)
        working-directory: VoiceInk
        run: make local LOCAL_CODESIGN_IDENTITY=-

      - name: Package app
        run: cd ~/Downloads && ditto -c -k --keepParent VoiceInk.app VoiceInk-local.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-local
          path: /Users/runner/Downloads/VoiceInk-local.zip
          if-no-files-found: error
